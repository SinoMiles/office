server {
    listen 80;
    server_name huggingpt.com www.huggingpt.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/huggingpt.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name huggingpt.com www.huggingpt.com;

    ssl_certificate /etc/letsencrypt/live/huggingpt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huggingpt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /www/wwwlogs/prompt-hub.log;
    error_log /www/wwwlogs/prompt-hub.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
}
