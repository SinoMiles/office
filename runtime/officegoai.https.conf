server {
    listen 80;
    server_name officegoai.com www.officegoai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/officegoai.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name officegoai.com www.officegoai.com;

    ssl_certificate /etc/letsencrypt/live/officegoai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/officegoai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        client_max_body_size 110m;
    }
}
